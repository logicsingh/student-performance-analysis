name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag student-performance-analysis:${GITHUB_SHA} .
      - name: Start container
        run: docker run --detach --name student-performance-analysis -p 127.0.0.1:5000:5000 student-performance-analysis:${GITHUB_SHA}
      - name: Smoke test health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs student-performance-analysis
          exit 1
      - name: Stop container
        if: always()
        run: docker rm --force student-performance-analysis || true
